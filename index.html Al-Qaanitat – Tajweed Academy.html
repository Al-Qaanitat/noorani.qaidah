const R4=[['Izhaar','اِظْهَار','ء ه ع ح غ خ','Noon ya tanween ko saaf parhen. Ghunnah nahi, aur agle harf se milayen nahi (halq ke 6 harf).','Halq ke harf = noon saaf, door khara!',[['مَنْ آمَنَ','2:62','Noon Sakin'],['مِنْ هَادٍ','13:33','Noon Sakin'],['سَمِيعٌ عَلِيمٌ','2:244','Tanween']]],['Idghaam','اِدْغَام','ي ر م ل و ن','Noon/tanween agle harf mein mil jata hai. ي ن م و ke sath ghunnah (2 harkat) = Bighunnah. ل ر ke sath ghunnah nahi = Bila ghunnah. Khayal: ek hi lafz mein ن ke baad ي ya و ho to idghaam nahi hota (دُنْيَا، صِنْوَانٌ).','Yarmaloon: ye 6 harf noon ko apne andar le lete hain',[['مَنْ يَقُولُ','2:8','Bighunnah'],['خَيْرًا يَرَهُ','99:7','Bighunnah (Tanween)'],['مِنْ رَبِّهِمْ','2:5','Bila ghunnah'],['هُدًى لِلْمُتَّقِينَ','2:2','Bila ghunnah (Tanween)']]],['Iqlaab','اِقْلَاب','ب','Ba se pehle noon/tanween ki awaaz meem mein badal jati hai. Honth halke milte hain aur ghunnah (2 harkat) hoti hai.','Noon “meem” ban jata hai, ب ka dost!',[['مِنْ بَعْدِ','2:27','Noon Sakin'],['سَمِيعًا بَصِيرًا','4:58','Tanween']]],['Ikhfaa','اِخْفَاء','ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك','Noon/tanween zabaan chhoo baghair naak mein halka chhupa kar parhen, ghunnah 2 harkat. Awaaz Izhaar aur Idghaam ke beech ki hoti hai.','15 harf ka jumla: صِفْ ذَا ثَنَا كَمْ جَادَ شَخْصٌ قَدْ سَمَا دُمْ طَيِّبًا زِدْ فِي تُقًى ضَعْ ظَالِمَا',[['مَنْ كَانَ','2:97','Noon Sakin'],['ثُمَّ أَنْتُمْ','2:85','Noon Sakin'],['رِيحًا صَرْصَرًا','41:16','Tanween']]]];
